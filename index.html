<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="icon.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: one dark screen, the reactor in the middle, four quiet corners, nothing else. */
:root {
  color-scheme: dark;
  --bg: #04070b;          /* night glass */
  --bg-2: #0a1118;
  --ink: #e8f0f4;
  --dim: #6f8190;
  --faint: #2a3a47;
  --amber: #ffad33;       /* reactor core, FRIDAY's voice */
  --amber-soft: rgba(255, 173, 51, .16);
  --cyan: #61e2ff;        /* listening */
  --red: #ff5a4f;         /* scan, alert */
  --f-display: "Chakra Petch", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
html, body { height: 100%; }
*, *::before, *::after { box-sizing: border-box; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-display);
  overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}
#app {
  position: relative; height: 100%; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  background: radial-gradient(120% 70% at 50% 42%, var(--bg-2) 0%, var(--bg) 62%);
}
#reactor { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.scan-lines { position: absolute; inset: 0; pointer-events: none; opacity: .35;
  background: repeating-linear-gradient(180deg, rgba(255,255,255,.025) 0 1px, transparent 1px 4px); }

/* corners */
.corner { position: absolute; display: grid; gap: 4px; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--dim); transition: opacity .8s ease, transform .8s ease; }
.boot .corner { opacity: 0; }
.tl { top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); transform: translate(0,0); }
.tr { top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); text-align: right; justify-items: end; }
.bl { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); }
.br { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); justify-items: end; }
.boot .tl { transform: translate(-12px, -12px); } .boot .tr { transform: translate(12px, -12px); }
.boot .bl { transform: translate(-12px, 12px); } .boot .br { transform: translate(12px, 12px); }
.clock { font-family: var(--f-display); font-size: 26px; font-weight: 600; letter-spacing: .06em; color: var(--ink); line-height: 1;
  font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 8px; align-items: center; white-space: nowrap; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); box-shadow: 0 0 0 1px rgba(255,255,255,.05); }
.dot.ok { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
.dot.live { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
.dot.bad { background: var(--red); box-shadow: 0 0 8px var(--red); }
.num { color: var(--ink); font-variant-numeric: tabular-nums; }

/* corner buttons */
.cbtn { width: 58px; height: 58px; border-radius: 50%; border: 1px solid rgba(255,173,51,.35); background: rgba(10,17,24,.72);
  display: grid; place-items: center; color: var(--amber); padding: 0; cursor: pointer; position: relative;
  box-shadow: inset 0 0 18px rgba(255,173,51,.08); }
.cbtn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
.cbtn:active { transform: scale(.94); }
.cbtn svg { width: 24px; height: 24px; }
.bars { display: flex; gap: 3px; align-items: center; height: 24px; }
.bars i { width: 3px; height: 6px; border-radius: 2px; background: currentColor; transition: height .09s linear; }
.cbtn.on { color: var(--cyan); border-color: rgba(97,226,255,.6); box-shadow: 0 0 22px rgba(97,226,255,.25), inset 0 0 18px rgba(97,226,255,.12); }
.cbtn.call { animation: callme 1.1s ease-in-out infinite; }
@keyframes callme { 50% { box-shadow: 0 0 0 10px rgba(255,90,79,.0), 0 0 26px rgba(255,90,79,.55); border-color: var(--red); color: var(--red); } }
.clabel { font-size: 9.5px; letter-spacing: .18em; }
.file-hit { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border-radius: 50%; }

/* center: state + subtitles */
.center-ui { position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none; display: grid; }
#state { position: absolute; left: 50%; transform: translateX(-50%); font-family: var(--f-mono); font-size: 10.5px;
  letter-spacing: .32em; color: var(--amber); text-transform: uppercase; white-space: nowrap; transition: color .3s; }
#subs { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  text-align: center; display: grid; gap: 8px; justify-items: center; }
#youSaid { font-family: var(--f-mono); font-size: 12px; color: var(--dim); max-width: 34ch; text-wrap: balance; min-height: 1em; }
#said { font-size: 19px; line-height: 1.35; font-weight: 500; max-width: 26ch; text-wrap: balance; min-height: 2.7em;
  text-shadow: 0 0 18px rgba(255,173,51,.18); }
#said .cur { display: inline-block; width: .45em; height: .95em; margin-left: 3px; vertical-align: -.1em; background: var(--amber);
  animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
.menu-btn { position: absolute; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: none; border: 1px solid var(--faint); color: var(--dim); font: 500 10.5px var(--f-mono); letter-spacing: .26em;
  padding: 9px 14px; border-radius: 999px; cursor: pointer; transition: opacity .8s; }
.menu-btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
.boot .menu-btn, .boot #state, .boot #subs { opacity: 0; }

/* boot */
#bootLayer { position: absolute; inset: 0; display: grid; place-items: center; z-index: 5; }
#bootLayer[hidden] { display: none !important; }
#tapStart { pointer-events: auto; background: none; border: 0; color: var(--ink); cursor: pointer; display: grid; gap: 14px;
  justify-items: center; font-family: var(--f-display); padding: 40px; }
#tapStart .name { font-size: 34px; font-weight: 700; letter-spacing: .42em; padding-left: .42em; }
#tapStart .hint { font: 500 11px var(--f-mono); letter-spacing: .3em; color: var(--amber); animation: breathe 2.2s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .35; } }
#bootLog { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  font: 11px/1.7 var(--f-mono); color: var(--dim); letter-spacing: .08em; white-space: pre; }
#bootLog b { color: var(--amber); font-weight: 500; }
#bootTitle { position: absolute; left: 0; right: 0; text-align: center; font-weight: 700; font-size: 22px; letter-spacing: .5em;
  padding-left: .5em; opacity: 0; transition: opacity .6s; }

/* input sheet */
#inputBar { position: fixed; left: 0; right: 0; top: 0; z-index: 20; background: rgba(6,10,15,.95); border-bottom: 1px solid rgba(97,226,255,.3);
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px));
  animation: drop .28s cubic-bezier(.2,.8,.2,1);
  display: grid; gap: 6px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
#inputBar form { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
#say { min-width: 0; width: 100%; font: 17px var(--f-display); color: var(--ink); background: var(--bg); border: 1px solid rgba(97,226,255,.45);
  border-radius: 12px; padding: 12px 14px; -webkit-user-select: text; user-select: text; }
#say:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(97,226,255,.15); }
.pill { font: 600 13px var(--f-display); letter-spacing: .12em; text-transform: uppercase; border-radius: 12px; padding: 12px 14px;
  border: 1px solid var(--faint); background: transparent; color: var(--dim); cursor: pointer; }
.pill.go { color: var(--bg); background: var(--amber); border-color: var(--amber); }
.pill:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.ihint { font: 10.5px var(--f-mono); color: var(--dim); letter-spacing: .06em; display: flex; justify-content: space-between; gap: 8px; }
.ihint label { display: flex; gap: 6px; align-items: center; }

/* sheets: menu, card, qr */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; max-height: 82%; overflow: auto; background: rgba(7,12,18,.97);
  border-top: 1px solid rgba(255,173,51,.3); border-radius: 18px 18px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 14px; animation: rise .32s cubic-bezier(.2,.8,.2,1); -webkit-user-select: text; user-select: text; }
@keyframes rise { from { transform: translateY(30px); opacity: 0; } }
@keyframes drop { from { transform: translateY(-24px); opacity: 0; } }
.sheet h2 { margin: 0; font-size: 13px; letter-spacing: .3em; color: var(--amber); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.act { text-align: left; background: var(--bg-2); border: 1px solid var(--faint); color: var(--ink); border-radius: 12px; padding: 12px;
  font: 600 14px var(--f-display); cursor: pointer; display: grid; gap: 3px; min-width: 0; }
.act small { font: 11px var(--f-mono); color: var(--dim); font-weight: 400; }
.act:focus-visible { outline: 2px solid var(--cyan); }
.field { display: grid; gap: 4px; font: 11px var(--f-mono); color: var(--dim); letter-spacing: .08em; }
.field input, .field select { font: 15px var(--f-display); color: var(--ink); background: var(--bg); border: 1px solid var(--faint);
  border-radius: 10px; padding: 10px 12px; min-width: 0; width: 100%; box-sizing: border-box; }
.close-x { justify-self: end; }
.backdrop { position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.45); }

/* result card (scan, email, agenda) */
#card { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  z-index: 12; border: 1px solid rgba(255,173,51,.35); background: rgba(6,10,15,.88); border-radius: 14px; padding: 14px;
  display: grid; gap: 10px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); animation: rise .35s ease; max-height: 46%; overflow: auto; }
#card .ctitle { font: 600 12px var(--f-mono); letter-spacing: .26em; color: var(--amber); text-transform: uppercase; display: flex; justify-content: space-between; gap: 8px; }
#card .kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 14px; }
#card .kv dt { font: 11px var(--f-mono); color: var(--dim); letter-spacing: .1em; text-transform: uppercase; padding-top: 2px; }
#card .kv dd { margin: 0; overflow-wrap: anywhere; }
#card img.shot { width: 100%; max-height: 140px; object-fit: cover; border-radius: 10px; filter: saturate(.7) contrast(1.05); }
#card .btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
#card pre { margin: 0; white-space: pre-wrap; font: 13px/1.45 var(--f-display); color: var(--ink); }
.qr-wrap { display: grid; justify-items: center; gap: 12px; text-align: center; }
#qrBox { background: #fff; padding: 14px; border-radius: 14px; }
#qrBox img, #qrBox canvas { display: block; width: 220px; height: 220px; }
.qr-cap { font-size: 15px; max-width: 30ch; }
#toast { position: absolute; top: calc(70px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 40;
  background: rgba(6,10,15,.94); border: 1px solid var(--faint); border-radius: 10px; padding: 8px 12px; font: 12px var(--f-mono);
  color: var(--ink); max-width: 86%; text-align: center; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
/* live camera with FRIDAY's sight */
#cam { position: fixed; inset: 0; z-index: 35; background: #000; }
#camVideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#camHud { position: absolute; inset: 0; width: 100%; height: 100%; }
.cam-bar { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(0deg, rgba(0,0,0,.7), transparent); }
.cam-bar .pill { justify-self: start; background: rgba(0,0,0,.5); color: var(--ink); }
.shutter { width: 76px; height: 76px; border-radius: 50%; border: 3px solid var(--amber); background: rgba(255,173,51,.18); cursor: pointer;
  box-shadow: 0 0 24px rgba(255,173,51,.45); }
.shutter:active { transform: scale(.94); background: rgba(255,173,51,.4); }
.shutter:focus-visible { outline: 2px solid var(--cyan); outline-offset: 4px; }
.note { margin: 0; font: 12.5px/1.5 var(--f-mono); color: var(--dim); }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grid3 .act { padding: 10px; font-size: 13px; }

/* asleep: everything around the reactor leaves the screen, each piece towards its own edge */
.corner, .menu-btn, #subs, #state, .scan-lines { transition: opacity .7s ease, transform .9s cubic-bezier(.6,0,.3,1); }
.asleep .corner, .asleep .menu-btn, .asleep #subs { opacity: 0; pointer-events: none; }
.asleep .tl { transform: translate(-28px, -28px); transition-delay: 0s; }
.asleep .tr { transform: translate(28px, -28px); transition-delay: .08s; }
.asleep .bl { transform: translate(-28px, 28px); transition-delay: .16s; }
.asleep .br { transform: translate(28px, 28px); transition-delay: .24s; }
.asleep .menu-btn { transform: translate(-50%, 30px); transition-delay: .2s; }
.asleep #subs { transform: translateY(16px); }
.asleep .scan-lines { opacity: .12; }
.asleep #state { color: var(--dim); opacity: .55; letter-spacing: .4em; transition-delay: 1.4s; }


/* windows */
#winLayer { position: absolute; inset: 0; pointer-events: none; z-index: 14; }
.win { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  top: calc(96px + env(safe-area-inset-top, 0px)); max-height: 56%; display: grid; grid-template-rows: auto minmax(0, 1fr);
  pointer-events: auto; background: linear-gradient(180deg, rgba(14,22,30,.94), rgba(6,10,15,.94)); border: 1px solid rgba(255,173,51,.4);
  border-radius: 4px 18px 4px 18px; box-shadow: 0 0 0 1px rgba(255,173,51,.06), 0 18px 50px rgba(0,0,0,.55), inset 0 0 30px rgba(255,173,51,.05);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  --depth: 0; transform: translateY(calc(var(--depth) * -13px)) scale(calc(1 - var(--depth) * .05));
  transition: transform .4s cubic-bezier(.2,.9,.2,1), opacity .4s, filter .4s;
  animation: winIn .5s cubic-bezier(.2,.9,.2,1) backwards; overflow: hidden; }
.win.behind { filter: brightness(.55) saturate(.7); cursor: pointer; }
.win.behind .wbody { pointer-events: none; }
.win::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(255,173,51,.18), transparent) no-repeat; background-size: 40% 100%;
  animation: sweep 1.1s ease-out .1s both; }
.win.closing { animation: winOut .3s cubic-bezier(.6,0,.8,.2) forwards; }
.win.flash { animation: winFlash .5s ease; }
@keyframes winIn { 0% { opacity: 0; transform: perspective(700px) scale(.15) rotateX(55deg); filter: blur(6px); clip-path: inset(48% 0 48% 0); }
  60% { opacity: 1; filter: none; clip-path: inset(0 0 0 0); } }
@keyframes winOut { to { opacity: 0; transform: scale(.3) translateY(60px); filter: blur(4px); } }
@keyframes winFlash { 30% { box-shadow: 0 0 0 2px var(--amber), 0 0 40px rgba(255,173,51,.5); } }
@keyframes sweep { from { background-position: -60% 0; } to { background-position: 180% 0; } }
.wbar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 10px 8px 12px;
  border-bottom: 1px solid rgba(255,173,51,.18); cursor: grab; touch-action: none; }
.wicon { width: 26px; height: 26px; display: grid; place-items: center; color: var(--amber); border: 1px solid rgba(255,173,51,.35); border-radius: 50%; }
.wicon svg { width: 15px; height: 15px; }
.wtitle { display: grid; min-width: 0; }
.wtitle span { font: 600 15px var(--f-display); letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wtitle small { font: 9.5px var(--f-mono); letter-spacing: .2em; color: var(--dim); text-transform: uppercase; }
.wclose { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--faint); background: transparent; color: var(--dim); font-size: 18px; cursor: pointer; }
.wclose:focus-visible { outline: 2px solid var(--cyan); }
.wbody { padding: 12px 14px 14px; overflow: auto; display: grid; gap: 12px; -webkit-user-select: text; user-select: text; }
.wbody .kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; margin: 0; font-size: 14px; }
.wbody .kv dt { font: 11px var(--f-mono); color: var(--dim); letter-spacing: .1em; text-transform: uppercase; padding-top: 2px; }
.wbody .kv dd { margin: 0; overflow-wrap: anywhere; }
.big { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; }
.big b { font: 600 46px/1 var(--f-display); color: var(--amber); font-variant-numeric: tabular-nums; }
.big b.mono-b { font: 500 17px/1.3 var(--f-mono); color: var(--amber); }
.big span { font-size: 16px; line-height: 1.35; }
.big small { font: 11.5px var(--f-mono); color: var(--dim); }
.spark { width: 100%; height: 44px; color: var(--amber); display: block; }
.hours { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; text-align: center; font-size: 15px; }
.hours span { display: grid; gap: 2px; padding: 6px 0; border: 1px solid var(--faint); border-radius: 8px; }
.hours b { font: 500 11px var(--f-mono); color: var(--dim); }
.hours small { font: 10.5px var(--f-mono); color: var(--cyan); }
.radar { height: 90px; border: 1px solid var(--faint); border-radius: 10px; position: relative; overflow: hidden;
  background: repeating-linear-gradient(0deg, transparent 0 17px, rgba(255,173,51,.07) 17px 18px), repeating-linear-gradient(90deg, transparent 0 17px, rgba(255,173,51,.07) 17px 18px); }
.radar i { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 12px var(--amber); }
.radar i::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 1px solid var(--amber); animation: ping 1.6s ease-out infinite; }
@keyframes ping { to { transform: scale(6); opacity: 0; } }
.wbtns { display: flex; gap: 8px; justify-content: flex-end; }
.compass { position: relative; width: 190px; height: 190px; margin: 0 auto; border-radius: 50%; border: 1px solid rgba(255,173,51,.45);
  display: grid; place-items: center; background: radial-gradient(circle, rgba(255,173,51,.08), transparent 70%); }
.needle { position: absolute; inset: 14px; transition: transform .15s linear;
  background: linear-gradient(var(--red), var(--red)) 50% 0 / 3px 50% no-repeat, linear-gradient(var(--dim), var(--dim)) 50% 100% / 3px 50% no-repeat; }
.compass b { position: relative; font: 500 15px var(--f-mono); background: var(--bg); padding: 4px 8px; border-radius: 6px; }
.tring { position: relative; width: 170px; height: 170px; margin: 0 auto; display: grid; place-items: center; }
.tring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.tbg { fill: none; stroke: var(--faint); stroke-width: 3; }
.tfg { fill: none; stroke: var(--amber); stroke-width: 4; stroke-dasharray: 100; stroke-dashoffset: 0; stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.tleft { font: 600 34px var(--f-display); font-variant-numeric: tabular-nums; }
.nlist, .slist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.nlist li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; border-bottom: 1px solid var(--faint); padding-bottom: 8px; }
.nlist span, .slist li { display: grid; gap: 2px; font-size: 15px; overflow-wrap: anywhere; }
.nlist small, .slist small { font: 10.5px var(--f-mono); color: var(--dim); }
.slist a { color: var(--ink); text-decoration-color: var(--amber); }
.huge { margin: 0; font: 600 30px/1.2 var(--f-display); text-wrap: balance; text-align: center; padding: 6px 0; }

<script>
(() => {
"use strict";

const store = {

  calls: 0, sources: [], afterSpeech: null, tx: 0, ty: 0, txT: 0, tyT: 0,

  boot() { tone(55, 1.6, { type: "sawtooth", gain: 0.18, to: 880, attack: 0.3 }); noise(1.4, { from: 200, to: 4000, gain: 0.12 });
    [523.25, 783.99, 1046.5].forEach((f, i) => tone(f, 1.6, { gain: 0.16, at: 1.55 + i * 0.07, attack: 0.02 })); },
  tap() { tone(1500, 0.05, { type: "triangle", gain: 0.18 }); },
  listen() { tone(660, 0.09, { gain: 0.2 }); tone(990, 0.12, { gain: 0.2, at: 0.08 }); },
  think() { tone(140, 0.35, { type: "sine", gain: 0.22, to: 180, attack: 0.08 }); },
  reply() { tone(1174.66, 0.18, { gain: 0.1 }); tone(1760, 0.22, { gain: 0.08, at: 0.06 }); },
  send() { noise(0.25, { from: 2500, to: 600, gain: 0.12 }); },
  scan() { noise(1.1, { from: 300, to: 5000, gain: 0.16 }); tone(880, 0.06, { gain: 0.12, at: 1.1 }); tone(1320, 0.1, { gain: 0.12, at: 1.18 }); },
  qr() { [880, 1108.73, 1318.51, 1760].forEach((f, i) => tone(f, 0.16, { gain: 0.12, at: i * 0.06 })); },
  error() { tone(150, 0.16, { type: "square", gain: 0.12 }); tone(110, 0.22, { type: "square", gain: 0.12, at: 0.18 }); },
  open() { tone(520, 0.12, { type: "triangle", gain: 0.12, to: 1040 }); noise(0.18, { from: 800, to: 3200, gain: 0.06 }); },
  close() { tone(900, 0.14, { type: "triangle", gain: 0.1, to: 380 }); },
  sleep() { tone(660, 0.9, { gain: 0.14, to: 160, attack: 0.05 }); noise(1.2, { from: 3000, to: 200, gain: 0.08 }); },
  wake() { tone(180, 0.7, { type: "sawtooth", gain: 0.1, to: 720, attack: 0.1 }); [659.25, 987.77].forEach((f, i) => tone(f, 0.5, { gain: 0.12, at: 0.55 + i * 0.08 })); },
  alarm() { [0, 0.35, 0.7, 1.05].forEach((at) => { tone(1318.5, 0.16, { type: "square", gain: 0.12, at }); tone(1760, 0.16, { type: "square", gain: 0.1, at: at + 0.16 }); }); },
  scanSoft() { noise(0.5, { from: 600, to: 2400, gain: 0.06 }); },
};

/* ------------------------------------------------------------------ reactor (canvas, pseudo-3D) */
// Awake, the rings lie flat, stacked into one reactor. When FRIDAY rests the reactor stays in the
// centre: the core drains, the whole thing tips back and the rings slide apart along its axis, layer
// by layer, like an exploded technical drawing that floats and slowly turns. Waking reverses it.
const cv = $("reactor"), cx2 = cv.getContext("2d");
let W = 0, H = 0, DPR = 1, CX = 0, CY = 0, R = 0;
function layout() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  CX = W / 2; CY = H * 0.4; R = Math.min(W * 0.33, H * 0.2, 190);

  $("subs").style.top = (CY + R * 1.28 + 30) + "px";
  $("bootTitle").style.top = (CY + R * 1.32) + "px";
  $("card").style.top = (CY - R * 1.2) + "px";

const COLORS = { idle: [255, 173, 51], listen: [97, 226, 255], think: [255, 173, 51], speak: [255, 173, 51], scan: [255, 90, 79],
  error: [255, 90, 79], sleep: [255, 128, 34] };
let col = [255, 173, 51], bootT = -1, lastNow = 0;
const BARS = Array.from(document.querySelectorAll("#micBtn .bars i"));
// each layer: its height along the reactor's axis when exploded (in R), how far it opens out, and
// when it starts to move (layers leave one after the other, the outer ones first)
const LAYERS = {
  ticks: { h: 1.15, open: 0.06, d: 0.00 },
  segs: { h: 0.72, open: 0.10, d: 0.08 },
  thin: { h: 0.42, open: 0.02, d: 0.14 },
  edge: { h: 0.06, open: 0.16, d: 0.22 },
  coils: { h: -0.06, open: 0.20, d: 0.22 },
  inner: { h: -0.48, open: 0.04, d: 0.30 },
  core: { h: -0.86, open: 0, d: 0.36 },

let V = { ox: 0, oy: 0, sc: 1, gx: 0, gy: 0, t: 0 };
// rest tween: kRest goes 0 -> 1 when FRIDAY rests, 1 -> 0 when she wakes (ease in-out, staggered per layer)
let kRest = 0, kFrom = 0, tw0 = 0, lastSleep = false;
const easeIO = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const clamp01 = (x) => Math.max(0, Math.min(1, x));
function layerK(name) {
  // outer layers leave first; waking plays it backwards, so the core comes back first
  const d = LAYERS[name].d, span = 0.62;
  return easeIO(clamp01((kRest - d) / span));
}
function proj(x, y, z) {
  const cgx = Math.cos(V.gx), sgx = Math.sin(V.gx), y3 = y * cgx - z * sgx, z3 = y * sgx + z * cgx;
  const cgy = Math.cos(V.gy), sgy = Math.sin(V.gy), x4 = x * cgy + z3 * sgy, z4 = -x * sgy + z3 * cgy;
  const f = 760, s = f / (f + z4);

}
function layerZ(name) { return LAYERS[name].h * R * 0.62 * layerK(name); }
function layerR(name, r) { return r * (1 + LAYERS[name].open * layerK(name)); }
function arc3(name, r, a0, a1, w, alpha) {
  const z = layerZ(name), rr = layerR(name, r), n = Math.max(6, Math.ceil(Math.abs(a1 - a0) / (Math.PI * 2) * 80));
  cx2.beginPath(); let ss = 0;
  for (let i = 0; i <= n; i++) {
    const a = a0 + (a1 - a0) * (i / n), [x, y, s] = proj(Math.cos(a) * rr, Math.sin(a) * rr, z);
    i ? cx2.lineTo(x, y) : cx2.moveTo(x, y); ss += s;
  }

  cx2.strokeStyle = `rgba(${col[0] | 0},${col[1] | 0},${col[2] | 0},${alpha})`; cx2.stroke();
}
function frame(now) {
  requestAnimationFrame(frame);

  const t = now / 1000; V.t = t;
  const want = COLORS[S.sleeping ? "sleep" : S.phase] || COLORS.idle;
  col = col.map((v, i) => v + (want[i] - v) * 0.06);
  // the rest tween
  if (S.sleeping !== lastSleep) { lastSleep = S.sleeping; kFrom = kRest; tw0 = now; }
  const dur = S.sleeping ? 2600 : 1500;
  kRest = kFrom + ((S.sleeping ? 1 : 0) - kFrom) * easeIO(clamp01((now - tw0) / dur));
  const k = easeIO(clamp01(kRest));
  const bp = bootT < 0 ? (S.booted ? 1 : 0) : Math.min(1, (now - bootT) / 2600);
  // level: speech envelope or ambient breathing
  if (S.phase === "speak") S.target = Math.max(S.target * 0.93, 0.25 + 0.2 * Math.sin(t * 9) * Math.sin(t * 3.7));
  else if (S.phase === "listen") S.target = 0.18 + Math.min(0.6, S.typing) + 0.05 * Math.sin(t * 4);
  else if (S.phase === "think") S.target = 0.3 + 0.15 * Math.sin(t * 6);

  V.sc = 1 - 0.14 * k;

  const stage = (a, b) => Math.max(0, Math.min(1, (bp - a) / (b - a)));
  const ease = (x) => 1 - Math.pow(1 - x, 3);

  const dim = S.booted || bootT >= 0 ? 1 : 0.25;
  const fade = 1 - 0.3 * k;   // rings a bit fainter at rest
  // halo
  const hr = R * 1.9 * V.sc;
  const g = cx2.createRadialGradient(V.ox, V.oy, R * 0.1 * V.sc, V.ox, V.oy, hr);
  g.addColorStop(0, `rgba(${col[0] | 0},${col[1] | 0},${col[2] | 0},${(0.12 + L * 0.25 * stage(0.55, 0.8)) * dim * (1 - 0.55 * k)})`);
  g.addColorStop(1, "rgba(0,0,0,0)");

      cx2.fillStyle = `rgba(${col[0] | 0},${col[1] | 0},${col[2] | 0},${0.6 * k})`; cx2.fill(); });
  }

      const [x0, y0] = proj(Math.cos(a) * r0, Math.sin(a) * r0, z), [x1, y1] = proj(Math.cos(a) * r1, Math.sin(a) * r1, z);
      cx2.beginPath(); cx2.moveTo(x0, y0); cx2.lineTo(x1, y1);
      cx2.strokeStyle = `rgba(${col[0] | 0},${col[1] | 0},${col[2] | 0},${(long ? 0.7 : 0.28) * fade})`; cx2.lineWidth = long ? 1.6 : 1; cx2.stroke();
    }
  }

  const s2 = ease(stage(0.18, 0.55));

      const a0 = rot + (i / segs) * Math.PI * 2, span = (Math.PI * 2 / segs) * 0.72 * s2;
      arc3("segs", R * 1.05, a0, a0 + span, 3, (0.55 + L * 0.4) * fade);

  const s3 = ease(stage(0.38, 0.75));

    const coils = 10, rot = t * 0.12 * spin;
    for (let i = 0; i < coils; i++) {
      const a = rot + (i / coils) * Math.PI * 2, span = (Math.PI * 2 / coils) * 0.62;
      arc3("coils", R * 0.72, a, a + span * s3, R * 0.16, (0.16 + L * 0.35) * fade);
      arc3("edge", R * 0.82, a, a + span * s3, 1.2, 0.6 * fade);
    }
    arc3("inner", R * 0.6, 0, Math.PI * 2 * s3, 1.4, 0.55 * fade);
  }
  // 4. core: drains to an ember when resting
  const s4 = ease(stage(0.6, 1));

    const cr = R * V.sc * (0.36 + L * 0.12) * s4 * drain;
    const cg = cx2.createRadialGradient(cxp, cyp, 0, cxp, cyp, cr * 1.6);
    cg.addColorStop(0, `rgba(255,255,255,${0.9 * s4 * (1 - 0.6 * k)})`);
    cg.addColorStop(0.35, `rgba(${col[0] | 0},${col[1] | 0},${col[2] | 0},${0.85 * s4})`);
    cg.addColorStop(1, `rgba(${col[0] | 0},${col[1] | 0},${col[2] | 0},0)`);
    cx2.fillStyle = cg; cx2.beginPath(); cx2.arc(cxp, cyp, cr * 1.6, 0, Math.PI * 2); cx2.fill();

      cx2.beginPath(); cx2.arc(V.ox + Math.cos(a) * r, V.oy + Math.sin(a) * r, 3, 0, Math.PI * 2);

    g.beginPath(); g.arc(w / 2, h / 2, 10 + 3 * Math.sin(t * 4), 0, Math.PI * 2); g.strokeStyle = "rgba(255,173,51,.7)"; g.lineWidth = 1.2; g.stroke();
    g.font = "500 11px 'IBM Plex Mono', monospace"; g.fillStyle = "rgba(255,173,51,.9)";
    g.fillText("FRIDAY // ACQUISIZIONE", x, y - 12);
    g.fillText("T+" + t.toFixed(1).padStart(6, "0"), x + s - 74, y + s + 20);
  };
  cancelAnimationFrame(camRAF); camRAF = requestAnimationFrame(loop);
}
function grabFrame() {
  const v = $("camVideo"), max = 1280, r = Math.min(1, max / Math.max(v.videoWidth || max, v.videoHeight || max));
  const c = document.createElement("canvas"); c.width = Math.round((v.videoWidth || 1280) * r); c.height = Math.round((v.videoHeight || 720) * r);
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.82);
}
function fileToJpeg(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const max = 1280, r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); resolve(c.toDataURL("image/jpeg", 0.82)); };
    img.onerror = () => reject(new Error("foto illeggibile")); img.src = url;
  });
}
const SCAN_PROMPT = `Sei FRIDAY, l'AI di Matteo (stasera vestito da Tony Stark). Analizza la foto come un HUD di Iron Man, in italiano, con ironia leggera.
Regole: descrivi solo cose visibili e innocue (costumi, vestiti, oggetti, luogo, atmosfera, espressione). Non dire mai chi è una persona e non stimare dati personali o sensibili (età precisa, origine, salute, orientamento). Se ci sono persone, sii gentile e simpatica.
Rispondi SOLO con JSON: {"titolo": "2-4 parole", "righe": [{"etichetta": "1-2 parole", "valore": "breve"}], "battuta": "1-2 frasi da dire ad alta voce"}. Da 3 a 5 righe.`;
async function analyze(dataUrl) {
  if (!apiKey()) { openKeySheet(); return; }
  hush(); tpReset(); setPhase("scan", "Analisi"); sfx.scan(); $("youSaid").textContent = "Scansione";
  showCard("Scansione", [["", "Analisi in corso…"]], dataUrl);
  const ctl = new AbortController(); S.ctl = ctl; S.busy = true;
  try {
    const r = await apiFetch({ model: model(), max_tokens: 500, messages: [{ role: "user", content: [
      { type: "image", source: { type: "base64", media_type: "image/jpeg", data: dataUrl.split(",")[1] } },
      { type: "text", text: SCAN_PROMPT }] }] }, ctl.signal);
    const j = await r.json();
    const raw = (j.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
    let data = null; try { data = JSON.parse(raw.slice(raw.indexOf("{"), raw.lastIndexOf("}") + 1)); } catch (e) { data = null; }
    const rows = data && Array.isArray(data.righe) ? data.righe.slice(0, 6).map((x) => [String(x.etichetta || ""), String(x.valore || "")]) : [];
    showCard(String((data && data.titolo) || "Scansione"), rows.length ? rows : [["", raw.slice(0, 200) || "Niente da segnalare"]], dataUrl);
    sfx.reply();
    const line = String((data && data.battuta) || "Scansione completata, capo.");
    TP.final = line; say(line);
    S.turns.push({ role: "user", content: `${nowCtx()} [Matteo ha scansionato una foto]` }, { role: "assistant", content: line + " " + rows.map((x) => x.join(": ")).join("; ") });
    store.set("turns", S.turns.slice(-16));
  } catch (e) {
    if (e && e.name === "AbortError") return;
    sfx.error(); setPhase("error"); say(apiErrorText(e));
  } finally { if (ctl === S.ctl) { S.busy = false; S.ctl = null; if (!speaking && !q.length) setPhase("idle"); } }
}

function showCard(title, rows, img) {

const plain = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\x20-\x7E\n]/g, "");
function vcard() {
  const c = S.contact, lines = ["BEGIN:VCARD", "VERSION:3.0", `N:;${plain(c.name)};;;`, `FN:${plain(c.name)}`];
  if (c.org) lines.push(`ORG:${plain(c.org)}`);
  if (c.phone) lines.push(`TEL;TYPE=CELL:${plain(c.phone)}`);
  if (c.email) lines.push(`EMAIL:${plain(c.email)}`);
  if (c.social) lines.push(`URL:${plain(c.social)}`);
  lines.push("END:VCARD");
  return lines.join("\n");
}
function showQR(kind, text) {
  if (typeof QRCode === "undefined") { toast("Il generatore di QR non si è caricato (serve la rete)."); return; }
  const isMsg = kind === "messaggio" && text.trim();
  const host = openSheet(`<h2>${isMsg ? "Messaggio" : "Contatto di " + esc(S.contact.name)}</h2>

    <button type="button" class="pill" id="qrClose">Chiudi</button>`);

}

function motion() {

    if (e.beta == null) return;
    S.txT = Math.max(-0.3, Math.min(0.3, (e.beta - 55) * 0.006)); S.tyT = Math.max(-0.3, Math.min(0.3, (e.gamma || 0) * 0.007));
  });

    const a = e.acceleration || {}; const m = Math.hypot(a.x || 0, a.y || 0, a.z || 0);
    if (m > 16 && Date.now() - lastShake > 2500 && S.booted) {
      lastShake = Date.now();
      if (S.sleeping) { wakeUp(); setTimeout(() => listen({ greet: true }), 700); }
    }
  });
}
async function boot() {

  setTimeout(() => {
    $("bootLayer").hidden = true; app.classList.remove("boot"); S.booted = true; setPhase("idle");
    const h = new Date().getHours(), hi = h < 13 && h >= 5 ? "Buongiorno" : h < 18 && h >= 13 ? "Buon pomeriggio" : "Buonasera";

    if (apiKey()) say(`${hi} capo. FRIDAY è online, tutti i sistemi sono operativi.${SR && store.get("wake", true) ? " Chiamami per nome quando ti servo." : ""}`);

    bumpIdle();
  }, 3700);
}
